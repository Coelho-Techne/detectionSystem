spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

sensor.diagnostics.data-transfer-out-of-spec=95
sensor.diagnostics.heartbeat-write-interval=60s
sensor.power.low-threshold=30
sensor.power.critical-threshold=15
sensor.power.heartbeat-write-interval=15m
sensor.inactivity.window=5m
sensor.inactivity.scan-interval-ms=30000
sensor.mqtt.client-id=detection-system
sensor.mqtt.ingestion-threads=4
sensor.mqtt.ingestion-queue-capacity=5000
sensor.mqtt.max-silence-seconds=300

# application-dev.properties broker local, sem TLS, sem segredo
sensor.mqtt.broker-url=tcp://localhost:1883
sensor.mqtt.clean-session=true
sensor.mqtt.persistence-dir=./target/mqtt-persistence

